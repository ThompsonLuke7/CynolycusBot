[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "core/shared_universe/tests",
    "signals/catalysts/tests",
    "signals/events/tests",
    "signals/events/forward_guidance/tests",
    "signals/meta_context/tests",
    "strategies/momentum_expansion/tests",
    "strategies/dealer_positioning/tests",
    "strategies/intraday_structure/tests",
    "strategies/multi_ticker_swing/tests",
    "signals/news/tests",
    "signals/social_attention/tests",
    "UI/tests",
    "scripts/capstone/tests",
    "research/options_lab/tests",
]
python_files = ["test_*.py"]
markers = [
    "safe: local smoke tests that should not submit orders or require broad recomputation",
    "network: tests that may call external APIs",
    "slow: tests that are intentionally long-running",
    "live: tests that touch live trading/session behavior",
]
addopts = "-ra"
