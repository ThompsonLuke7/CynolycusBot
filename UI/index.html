<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cynolycus Live Dashboard</title>
  <style>
    :root {
      --bg: #08131f;
      --panel: #0f1f31;
      --panel-2: #122941;
      --text: #d7e4f7;
      --muted: #90a5c2;
      --good: #2ccf7a;
      --bad: #f05c52;
      --accent: #4cb8ff;
      --gold: #f0b04f;
      --line: #1f3a56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI Variable", "Bahnschrift", "Trebuchet MS", sans-serif;
      background: radial-gradient(1200px 700px at 10% 0%, #173455 0%, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 18px 28px;
      display: grid;
      gap: 14px;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.4px;
      font-weight: 700;
    }
    .status {
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: 999px;
      background: #173452;
      color: #c7ddfa;
      border: 1px solid #2d5783;
      white-space: nowrap;
    }
    .status.running { background: #123a2c; border-color: #2b8f65; color: #cef6e3; }
    .status.error { background: #4a1f20; border-color: #a84648; color: #ffd8d8; }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 8px;
      align-items: end;
    }
    .field {
      display: grid;
      gap: 4px;
    }
    .field label {
      font-size: 0.73rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input, select {
      width: 100%;
      background: #0a1725;
      border: 1px solid #2b4868;
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
    }
    .checks {
      grid-column: 1 / span 5;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 6px 10px;
      padding-bottom: 2px;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .checks label {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.15;
      min-width: 0;
      word-break: break-word;
    }
    .checks input[type="checkbox"] {
      margin-top: 1px;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }
    .btns {
      grid-column: 6;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    button {
      border: 1px solid #3f6694;
      background: #153153;
      color: #e5f1ff;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button.stop { background: #4b1f23; border-color: #8e3f48; }

    .grid {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    .grid > .card { min-width: 0; }
    .chart-wrap { height: 650px; }
    canvas { width: 100%; height: 100%; background: #0a1725; border-radius: 8px; border: 1px solid #233e5b; }
    .meta {
      display: grid;
      gap: 8px;
      font-family: "Consolas", "Cascadia Code", monospace;
      font-size: 0.84rem;
    }
    .kv {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid #2a4767;
      border-radius: 8px;
      background: #0b1b2b;
    }
    .kv span:last-child { color: #f2f7ff; }
    .logs {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .logs > .card { min-width: 0; }
    .list {
      max-height: 260px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid #284665;
      border-radius: 8px;
      background: #091624;
      padding: 8px;
      font-family: "Consolas", "Cascadia Code", monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .line {
      padding: 4px 0;
      border-bottom: 1px solid #1a324c;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .line:last-child { border-bottom: 0; }
    .up { color: var(--good); }
    .down { color: var(--bad); }
    @media (max-width: 980px) {
      .controls { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .checks { grid-column: 1 / -1; }
      .btns { grid-column: 1 / -1; justify-content: flex-start; }
      .grid { grid-template-columns: 1fr; }
      .logs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <h1>10min Meta Runner Dashboard</h1>
      <div id="statusBadge" class="status">idle</div>
    </div>

    <div class="card">
      <div class="controls">
        <div class="field"><label>Mode</label><select id="runnerMode"><option value="live">Live</option><option value="replay" selected>Replay</option></select></div>
        <div class="field"><label>Symbols</label><input id="symbols" value="SPY" /></div>
        <div class="field"><label>Feed</label><select id="feed"><option value="IEX">IEX</option><option value="SIP">SIP</option></select></div>
        <div class="field"><label>Interval (min)</label><input id="interval" type="number" value="10" min="1" /></div>
        <div class="field"><label>Signal Model</label><input value="Meta-XGB (10min)" disabled /></div>
        <div class="field"><label>Meta Model Root</label><input id="metaModelRoot" value="Data/models/meta_xgboost/10min" /></div>
        <div class="field"><label>Meta Matrix Path</label><input id="metaBaseFramePath" value="Data/inference/spy/10min/debug_matrices_warmup/spy/live_meta_matrix_on_trace_ts_live_2026_03_24.parquet" /></div>
        <div class="field"><label>Live Prefill Start</label><input id="prefillStart" value="2026-01-30" /></div>
        <div class="field"><label>Prefill Path</label><input id="prefillPath" value="Data/raw/spy/spy_intraday_1min_live_2026_03_24.parquet" /></div>
        <div class="field"><label>Env File</label><input id="envFile" value=".env" /></div>
        <div class="field"><label>Replay Data Path</label><input id="replayDataPath" value="Data/raw/spy/spy_intraday_1min_live_2026_03_24.parquet" /></div>
        <div class="field"><label>Replay Start</label><input id="replayStart" value="2026-03-14T00:00:00Z" placeholder="optional ISO datetime" /></div>
        <div class="field"><label>Replay End</label><input id="replayEnd" value="2026-03-23T23:59:59Z" placeholder="optional ISO datetime" /></div>
        <div class="field"><label>Replay Sleep (sec)</label><input id="replaySleep" type="number" step="0.01" min="0" value="0.0" /></div>
        <div class="field"><label>Flip Abs Min</label><input id="execFlipAbsThreshold" type="number" step="0.01" min="0" value="0.05" /></div>
        <div class="field"><label>Catch-up Max Age (min)</label><input id="startupCatchupMaxAgeMin" type="number" min="0" value="120" /></div>
        <div class="field"><label>Replay Max Bars</label><input id="replayMaxBars" type="number" min="1" placeholder="all" /></div>
        <div class="checks">
          <label><input id="enableOrders" type="checkbox" checked /> Option Orders</label>
          <label><input id="simulateOrders" type="checkbox" checked /> Simulate</label>
          <label><input id="noPrefillFetch" type="checkbox" /> No Prefill Fetch</label>
          <label><input id="startupCatchupOrder" type="checkbox" /> Startup Catch-up Order</label>
          <label><input id="replayRegularOnly" type="checkbox" /> Replay RTH Only</label>
          <label><input id="replayNoWarmup" type="checkbox" /> Replay No Warmup</label>
        </div>
        <div class="btns">
          <button id="refreshBtn">Refresh</button>
          <button id="startBtn">Start</button>
          <button id="stopBtn" class="stop">Stop</button>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;">
          <div style="font-weight:700;">Price Buffer</div>
          <select id="symbolSelect"></select>
        </div>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </div>
      <div class="card">
        <div style="font-weight:700;padding-bottom:8px;">Meta / Position State</div>
        <div id="meta" class="meta"></div>
        <div style="font-weight:700;padding:12px 0 8px;">Broker Positions / Orders</div>
        <div id="brokerPanel" class="list"></div>
      </div>
    </div>

    <div class="logs">
      <div class="card">
        <div style="font-weight:700;padding-bottom:8px;">Trade Events</div>
        <div id="tradeList" class="list"></div>
      </div>
      <div class="card">
        <div style="font-weight:700;padding-bottom:8px;">Live Log</div>
        <div id="logList" class="list"></div>
      </div>
    </div>
  </div>

  <script>
    const state = { running: false, status_message: "idle", symbols: [], bars_1m: {}, bars_15m: {}, last_actions: {}, action_events: [], policy_state: {}, broker_state: {}, trade_events: [], logs: [], agent_state: null, chart_view: {} };
    const hover = { active: false, x: 0, y: 0 };
    let eventSource = null;
    const MAX_POINTS_SIGNAL = 900;
    const ONE_MINUTE_POINTS_PER_SIGNAL_BAR = 20;
    const MAX_POINTS_1M = MAX_POINTS_SIGNAL * ONE_MINUTE_POINTS_PER_SIGNAL_BAR;
    const CHART_WINDOW_10M = 140;
    const CHART_WINDOW_1M_FALLBACK = 220;
    const CHART_WHEEL_STEP_BARS = 6;

    const statusBadge = document.getElementById("statusBadge");
    const symbolSelect = document.getElementById("symbolSelect");
    const chart = document.getElementById("chart");
    const metaEl = document.getElementById("meta");
    const brokerPanel = document.getElementById("brokerPanel");
    const tradeList = document.getElementById("tradeList");
    const logList = document.getElementById("logList");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function applyModeUi() {
      const mode = document.getElementById("runnerMode").value;
      const replay = mode === "replay";
      const simulate = document.getElementById("simulateOrders");
      if (replay) simulate.checked = true;
      simulate.disabled = replay;
      document.getElementById("feed").disabled = replay;
      document.getElementById("prefillStart").disabled = replay;
      const replayIds = [
        "replayDataPath",
        "replayStart",
        "replayEnd",
        "replaySleep",
        "replayMaxBars",
        "replayRegularOnly",
        "replayNoWarmup",
      ];
      replayIds.forEach((id) => { document.getElementById(id).disabled = !replay; });
      const startupCatchupIds = ["startupCatchupOrder", "startupCatchupMaxAgeMin"];
      startupCatchupIds.forEach((id) => { document.getElementById(id).disabled = replay; });
    }

    function updateStatus(text, mode = "idle") {
      statusBadge.textContent = text;
      statusBadge.className = `status ${mode}`;
    }

    async function api(path, method = "GET", payload = null) {
      let res;
      try {
        res = await fetch(path, {
          method,
          headers: { "Content-Type": "application/json" },
          body: payload ? JSON.stringify(payload) : undefined
        });
      } catch (err) {
        return { ok: false, status: 0, error: String(err) };
      }

      let body = null;
      let text = "";
      try {
        body = await res.json();
      } catch (_err) {
        try { text = await res.text(); } catch (__err) { text = ""; }
      }

      if (!res.ok) {
        const err = (body && (body.error || body.message)) || text || `HTTP ${res.status}`;
        return { ok: false, status: res.status, error: err, data: body };
      }

      if (body && typeof body === "object" && body.ok === false) {
        return { ok: false, status: res.status, error: body.error || "request failed", data: body };
      }
      return { ok: true, status: res.status, data: body, state: body?.state };
    }

    function pushLimited(bucket, symbol, item, maxPoints = MAX_POINTS_SIGNAL) {
      if (!bucket[symbol]) bucket[symbol] = [];
      bucket[symbol].push(item);
      if (bucket[symbol].length > maxPoints) bucket[symbol] = bucket[symbol].slice(-maxPoints);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function syncSymbolSelect() {
      const symbols = (state.symbols && state.symbols.length)
        ? state.symbols
        : (Array.isArray(state.config?.symbols) ? state.config.symbols : []);
      if (!symbols.length) {
        symbolSelect.innerHTML = `<option value="SPY">SPY</option>`;
        return;
      }
      const prev = symbolSelect.value;
      symbolSelect.innerHTML = symbols.map(s => `<option value="${s}">${s}</option>`).join("");
      if (symbols.includes(prev)) symbolSelect.value = prev;
    }

    function normalizeAgentState(agentState) {
      if (!agentState || typeof agentState !== "object") return agentState;
      const out = { ...agentState };
      const lastProbs = out.last_probs;
      if (lastProbs && typeof lastProbs === "object") {
        Object.entries(lastProbs).forEach(([key, value]) => {
          out[key] = value;
        });
      }
      const lastThresholds = out.last_thresholds;
      if (lastThresholds && typeof lastThresholds === "object") {
        Object.entries(lastThresholds).forEach(([key, value]) => {
          out[`thr_${key}`] = value;
        });
      }
      const lastProbSources = out.last_prob_sources;
      if (lastProbSources && typeof lastProbSources === "object") {
        Object.entries(lastProbSources).forEach(([key, value]) => {
          out[key] = value;
        });
      }
      return out;
    }

    function renderMeta() {
      const sym = symbolSelect.value || state.symbols?.[0] || "SPY";
      const action = state.last_actions?.[sym];
      const pol = state.policy_state?.[sym] || {};
      const brk = state.broker_state?.[sym] || {};
      const ag = state.agent_state || {};
      const recentActs = (state.action_events || []).filter((x) => x && x.symbol === sym).slice(-120);
      const actionClass = (x) => {
        const cls = Number(x?.action_class);
        if (Number.isFinite(cls)) return cls;
        const a = Number(x?.action);
        if (a === 2) return -1; // legacy short encoding
        if (a === 1) return 1;
        if (a === 0) return 0;
        if (Number.isFinite(a)) return a > 0 ? 1 : (a < 0 ? -1 : 0);
        return 0;
      };
      const cNeg = recentActs.filter((x) => actionClass(x) === -1).length;
      const c0 = recentActs.filter((x) => actionClass(x) === 0).length;
      const cPos = recentActs.filter((x) => actionClass(x) === 1).length;
      const lastClass = action ? actionClass(action) : null;
      const lastRaw = action && Number.isFinite(Number(action.action_raw)) ? Number(action.action_raw).toFixed(3) : null;
      const hedged = Number(pol.long_contracts || 0) > 0 && Number(pol.short_contracts || 0) > 0;
      const lastActionText = hedged
        ? `hedged${lastRaw !== null ? ` (${lastRaw})` : ""}`
        : (action ? `${lastClass}${lastRaw !== null ? ` (${lastRaw})` : ""}` : "-");
      const netPositionText = hedged ? "hedged" : (pol.position ?? "-");
      const rows = [
          ["Symbol", sym],
          ["Last Action", lastActionText],
          ["Action Time", action ? formatEventTs(action.timestamp) : "-"],
          ["Recent Signal Mix (-1/0/+1)", `${cNeg}/${c0}/${cPos}`],
          ["Net Position", netPositionText],
          ["Long Decision Reason", pol.long_decision_reason ?? "-"],
          ["Short Decision Reason", pol.short_decision_reason ?? "-"],
          ["Long Soft Exit Count", pol.long_soft_exit_count ?? "-"],
          ["Short Soft Exit Count", pol.short_soft_exit_count ?? "-"],
          ["Long 1m Intent Active", pol.long_intrabar_intent_active ?? "-"],
          ["Short 1m Intent Active", pol.short_intrabar_intent_active ?? "-"],
          ["Open Long", pol.open_long_symbol || "-"],
          ["Open Short", pol.open_short_symbol || "-"],
        ["Long Contracts", pol.long_contracts ?? "-"],
        ["Short Contracts", pol.short_contracts ?? "-"],
        ["ATR", pol.atr ?? "-"],
        ["Entry Price", ag.entry_price ?? "-"],
        ["p_enter_long", ag.p_enter_long ?? "-"],
        ["p_enter_short", ag.p_enter_short ?? "-"],
        ["p_exit_long", ag.p_exit_long ?? "-"],
        ["p_exit_short", ag.p_exit_short ?? "-"],
        ["p_pivot_long_source", ag.p_pivot_long_source ?? "-"],
        ["p_pivot_short_source", ag.p_pivot_short_source ?? "-"],
        ["p_tb_long_source", ag.p_tb_long_source ?? "-"],
        ["p_tb_short_source", ag.p_tb_short_source ?? "-"],
        ["thr_enter_long", ag.thr_enter_long ?? "-"],
        ["thr_enter_short", ag.thr_enter_short ?? "-"],
        ["thr_exit_long", ag.thr_exit_long ?? "-"],
        ["thr_exit_short", ag.thr_exit_short ?? "-"],
        ["Unrealized PnL", ag.unrealized_pnl ?? "-"],
        ["Realized Today", ag.realized_pnl_today ?? "-"],
        ["Realized Total", ag.realized_pnl_total ?? "-"],
        ["Broker Positions", (brk.positions || []).length],
        ["Recent Orders", (brk.recent_orders || []).length]
      ];
      metaEl.innerHTML = rows.map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("");
    }

    function renderTrades() {
      const items = (state.trade_events || []).slice(-80).reverse();
      tradeList.innerHTML = items.map(x => {
        const ev = x?.result?.event || "n/a";
        const cls = ev === "enter" || ev === "flip" ? "up" : (ev === "error" ? "down" : "");
        const full = JSON.stringify(x.result || {});
        const compact = full.length > 320 ? `${full.slice(0, 320)} ...` : full;
        return `<div class="line ${cls}" title="${escapeHtml(full)}">${escapeHtml(formatEventTs(x.timestamp))} ${escapeHtml(x.symbol || "")} ${escapeHtml(ev)} ${escapeHtml(compact)}</div>`;
      }).join("");
    }

    function renderBroker() {
      const sym = symbolSelect.value || state.symbols?.[0] || "SPY";
      const snap = state.broker_state?.[sym] || {};
      const pos = snap.positions || [];
      const orders = snap.recent_orders || [];
      const chunks = [];
      if (!pos.length) chunks.push(`<div class="line">positions: none</div>`);
      else {
        pos.forEach(p => {
          chunks.push(`<div class="line up">pos ${p.symbol || ""} qty=${p.qty ?? "-"} side=${p.side || "-"} uPnL=${p.unrealized_pl ?? "-"}</div>`);
        });
      }
      if (!orders.length) chunks.push(`<div class="line">orders: none</div>`);
      else {
        orders.slice(0, 10).forEach(o => {
          const cls = (o.status === "filled" || o.status === "partially_filled") ? "up" : (o.status === "rejected" || o.status === "canceled" ? "down" : "");
          chunks.push(`<div class="line ${cls}">ord ${o.symbol || ""} ${o.side || "-"} qty=${o.qty || "-"} status=${o.status || "-"} filled=${o.filled_qty || "-"}</div>`);
        });
      }
      brokerPanel.innerHTML = chunks.join("");
    }

    function renderLogs() {
      const items = (state.logs || []).slice(-120).reverse();
      logList.innerHTML = items.map(x => {
        const symbol = x.symbol || "SYSTEM";
        const msg = String(x.message || "");
        const compact = msg.length > 240 ? `${msg.slice(0, 240)} ...` : msg;
        return `<div class="line" title="${escapeHtml(msg)}">${escapeHtml(formatEventTs(x.timestamp))} ${escapeHtml(symbol)} ${escapeHtml(compact)}</div>`;
      }).join("");
    }

    function formatEventTs(value) {
      if (!value) return "-";
      const dt = new Date(value);
      if (Number.isNaN(dt.getTime())) return String(value);
      const datePart = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        month: "2-digit",
        day: "2-digit",
      }).format(dt);
      const timePart = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      }).format(dt);
      return `${datePart} ${timePart} ET`;
    }

    function fmtPrice(x) {
      return Number.isFinite(x) ? x.toFixed(2) : "-";
    }

    function fmtTickTime(dateObj, spanMs) {
      if (!(dateObj instanceof Date) || Number.isNaN(dateObj.getTime())) return "";
      if (spanMs > 24 * 60 * 60 * 1000) {
        return `${String(dateObj.getMonth() + 1).padStart(2, "0")}/${String(dateObj.getDate()).padStart(2, "0")} ${String(dateObj.getHours()).padStart(2, "0")}:${String(dateObj.getMinutes()).padStart(2, "0")}`;
      }
      return `${String(dateObj.getHours()).padStart(2, "0")}:${String(dateObj.getMinutes()).padStart(2, "0")}`;
    }

    function fmtHoverTime(dateObj) {
      if (!(dateObj instanceof Date) || Number.isNaN(dateObj.getTime())) return "";
      return `${String(dateObj.getMonth() + 1).padStart(2, "0")}/${String(dateObj.getDate()).padStart(2, "0")} ${String(dateObj.getHours()).padStart(2, "0")}:${String(dateObj.getMinutes()).padStart(2, "0")}`;
    }

    function nearestIndexByTime(series, targetMs) {
      let bestIdx = 0;
      let bestDiff = Number.POSITIVE_INFINITY;
      for (let i = 0; i < series.length; i += 1) {
        const d = Math.abs(series[i].t.getTime() - targetMs);
        if (d < bestDiff) {
          bestDiff = d;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    function timestampMs(value) {
      const tms = new Date(value).getTime();
      return Number.isFinite(tms) ? tms : Number.NaN;
    }

    function deriveTimeDomain(series, barIntervalMs) {
      if (!series.length) return null;
      const startMs = series[0].t.getTime();
      const lastMs = series[series.length - 1].t.getTime();
      if (!Number.isFinite(startMs) || !Number.isFinite(lastMs)) return null;
      const endMs = lastMs + Math.max(1, Number(barIntervalMs) || 1);
      if (!(endMs > startMs)) return null;
      return { startMs, endMs };
    }

    function getChartView(sym) {
      state.chart_view = state.chart_view || {};
      if (!state.chart_view[sym]) state.chart_view[sym] = { offset_10m_bars: 0 };
      return state.chart_view[sym];
    }

    function clampChartOffset(sym) {
      const view = getChartView(sym);
      const totalBars = (state.bars_15m?.[sym] || []).length;
      const maxOffset = Math.max(0, totalBars - CHART_WINDOW_10M);
      const raw = Number(view.offset_10m_bars || 0);
      view.offset_10m_bars = Math.max(0, Math.min(maxOffset, Number.isFinite(raw) ? Math.round(raw) : 0));
      return { view, totalBars, maxOffset };
    }

    function renderChart() {
      const sym = symbolSelect.value || state.symbols?.[0];
      const { view, totalBars, maxOffset } = clampChartOffset(sym || "SPY");
      const signalIntervalMin = Math.max(1, Number(document.getElementById("interval")?.value || 10));
      const intervalMs = signalIntervalMin * 60 * 1000;
      const raw1m = state.bars_1m?.[sym] || [];
      const raw10m = state.bars_15m?.[sym] || [];
      const end10m = Math.max(0, totalBars - view.offset_10m_bars);
      const start10m = Math.max(0, end10m - CHART_WINDOW_10M);
      const visible10mRaw = raw10m.slice(start10m, end10m);

      let visible1mRaw = raw1m.slice(-CHART_WINDOW_1M_FALLBACK);
      if (visible10mRaw.length) {
        const visibleStartMs = timestampMs(visible10mRaw[0].timestamp);
        const visibleEndMs = timestampMs(visible10mRaw[visible10mRaw.length - 1].timestamp) + intervalMs;
        if (Number.isFinite(visibleStartMs) && Number.isFinite(visibleEndMs) && visibleEndMs > visibleStartMs) {
          visible1mRaw = raw1m.filter((row) => {
            const tms = timestampMs(row.timestamp);
            return Number.isFinite(tms) && tms >= visibleStartMs && tms <= visibleEndMs;
          });
        }
      }
      if (!visible1mRaw.length && raw1m.length) {
        visible1mRaw = raw1m.slice(-CHART_WINDOW_1M_FALLBACK);
      }

      const one = visible1mRaw.map((x) => ({
        t: new Date(x.timestamp),
        open: Number(x.open),
        high: Number(x.high),
        low: Number(x.low),
        close: Number(x.close)
      })).filter((x) => Number.isFinite(x.open) && Number.isFinite(x.high) && Number.isFinite(x.low) && Number.isFinite(x.close) && !Number.isNaN(x.t.getTime()));
      const fifteen = visible10mRaw.map((x) => ({
        t: new Date(x.timestamp),
        open: Number(x.open),
        high: Number(x.high),
        low: Number(x.low),
        close: Number(x.close)
      })).filter((x) => Number.isFinite(x.open) && Number.isFinite(x.high) && Number.isFinite(x.low) && Number.isFinite(x.close) && !Number.isNaN(x.t.getTime()));
      const probs = visible10mRaw.map((x) => ({
        t: new Date(x.timestamp),
        p_enter_long: Number(x.p_enter_long),
        p_enter_short: Number(x.p_enter_short),
        p_exit_long: Number(x.p_exit_long),
        p_exit_short: Number(x.p_exit_short),
        p_pivot_long: Number(x.p_pivot_long),
        p_pivot_short: Number(x.p_pivot_short),
        p_tb_long: Number(x.p_tb_long),
        p_tb_short: Number(x.p_tb_short)
      })).filter((x) => !Number.isNaN(x.t.getTime()));

      const pane1Domain = deriveTimeDomain(one, 60 * 1000);
      const pane2Domain = deriveTimeDomain(fifteen, intervalMs);
      const pane3Domain = deriveTimeDomain(probs, intervalMs);

      const ctx = chart.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const w = chart.clientWidth;
      const h = chart.clientHeight;
      chart.width = Math.floor(w * dpr);
      chart.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0a1725";
      ctx.fillRect(0, 0, w, h);

      if (!one.length && !fifteen.length) return;

      const left = 58;
      const right = 28;
      const top = 30;
      const bottom = 28;
      const gap = 24;
      const plotW = Math.max(1, w - left - right);
      const totalH = Math.max(1, h - top - bottom - gap * 2);
      const pane1H = Math.max(1, totalH * 0.45);
      const pane2H = Math.max(1, totalH * 0.35);
      const pane3H = Math.max(1, totalH - pane1H - pane2H);
      const pane1Y = top;
      const pane2Y = top + pane1H + gap;
      const pane3Y = pane2Y + pane2H + gap;

      function drawPane(series, y0, paneHeight, label, options = {}) {
        const showXAxis = !!options.showXAxis;
        const xDomain = options.xDomain || deriveTimeDomain(series, options.barIntervalMs || 60 * 1000);
        const barIntervalMs = Math.max(1, Number(options.barIntervalMs) || 60 * 1000);
        if (!series.length) {
          ctx.fillStyle = "#8ca6c5";
          ctx.font = "12px Consolas, monospace";
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.fillText(`${label}: waiting for bars`, left + 6, y0 + 6);
          return null;
        }
        let minP = Math.min(...series.map((x) => x.low));
        let maxP = Math.max(...series.map((x) => x.high));
        if (Math.abs(maxP - minP) < 1e-9) {
          maxP += 0.5;
          minP -= 0.5;
        }
        const yPad = (maxP - minP) * 0.08;
        maxP += yPad;
        minP -= yPad;
        const toY = (p) => y0 + ((maxP - p) / (maxP - minP)) * paneHeight;
        const domainStartMs = xDomain?.startMs ?? series[0].t.getTime();
        const domainEndMs = xDomain?.endMs ?? (series[series.length - 1].t.getTime() + barIntervalMs);
        const domainSpanMs = Math.max(barIntervalMs, domainEndMs - domainStartMs);
        const toXTime = (tms) => left + (((tms - domainStartMs) / domainSpanMs) * plotW);
        const xToTime = (x) => domainStartMs + (((x - left) / Math.max(1, plotW)) * domainSpanMs);
        const toX = (idx) => {
          const row = series[idx];
          const rowMs = row ? row.t.getTime() : domainStartMs;
          return toXTime(rowMs + barIntervalMs / 2);
        };

        ctx.strokeStyle = "#214160";
        ctx.lineWidth = 1;
        ctx.font = "11px Consolas, monospace";
        ctx.fillStyle = "#8ca6c5";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        const yTicks = 4;
        for (let i = 0; i < yTicks; i += 1) {
          const frac = i / (yTicks - 1);
          const y = y0 + frac * paneHeight;
          const p = maxP - frac * (maxP - minP);
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(w - right, y);
          ctx.stroke();
          ctx.fillText(fmtPrice(p), left - 6, y);
        }

        ctx.strokeStyle = "#3b5676";
        ctx.beginPath();
        ctx.moveTo(left, y0);
        ctx.lineTo(left, y0 + paneHeight);
        ctx.lineTo(w - right, y0 + paneHeight);
        ctx.stroke();

        const bodyW = Math.max(1, Math.min(10, (plotW * (barIntervalMs / domainSpanMs)) * 0.72));
        series.forEach((c, i) => {
          const x = toX(i);
          const yH = toY(c.high);
          const yL = toY(c.low);
          const yO = toY(c.open);
          const yC = toY(c.close);
          const up = c.close >= c.open;
          const color = up ? "#2ccf7a" : "#f05c52";
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, yH);
          ctx.lineTo(x, yL);
          ctx.stroke();
          const topY = Math.min(yO, yC);
          const bodyH = Math.max(1, Math.abs(yC - yO));
          ctx.fillStyle = color;
          ctx.fillRect(x - bodyW / 2, topY, bodyW, bodyH);
        });

        ctx.fillStyle = "#9ec7ef";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = "11px Consolas, monospace";
        ctx.fillText(label, left + 6, y0 + 2);

        if (showXAxis) {
          const xTicks = 6;
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          for (let i = 0; i < xTicks; i += 1) {
            const frac = i / (xTicks - 1);
            const tickMs = domainStartMs + frac * domainSpanMs;
            const x = toXTime(tickMs);
            const labelX = Math.max(left + 28, Math.min(w - right - 28, x));
            const t = new Date(tickMs);
            ctx.beginPath();
            ctx.moveTo(x, y0 + paneHeight);
            ctx.lineTo(x, y0 + paneHeight + 4);
            ctx.strokeStyle = "#365272";
            ctx.stroke();
            ctx.fillStyle = "#8ca6c5";
            ctx.fillText(fmtTickTime(t, domainSpanMs), labelX, y0 + paneHeight + 6);
          }
        }
        const fromY = (y) => maxP - ((y - y0) / paneHeight) * (maxP - minP);
        return { series, toX, toXTime, xToTime, toY, fromY, y0, paneHeight, domainStartMs, domainEndMs, barIntervalMs };
      }

      const pane1 = drawPane(one, pane1Y, pane1H, "Top: 1m candles", {
        showXAxis: false,
        xDomain: pane1Domain,
        barIntervalMs: 60 * 1000
      });
      const pane2 = drawPane(fifteen, pane2Y, pane2H, "Middle: 10m candles", {
        showXAxis: true,
        xDomain: pane2Domain,
        barIntervalMs: intervalMs
      });

      function drawProbPane(series, y0, paneHeight, label, options = {}) {
        const xDomain = options.xDomain || deriveTimeDomain(series, options.barIntervalMs || intervalMs);
        const barIntervalMs = Math.max(1, Number(options.barIntervalMs) || intervalMs);
        if (!series.length) {
          ctx.fillStyle = "#8ca6c5";
          ctx.font = "12px Consolas, monospace";
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.fillText(`${label}: waiting for probs`, left + 6, y0 + 6);
          return null;
        }
        const toY = (p) => y0 + (1 - p) * paneHeight;
        const domainStartMs = xDomain?.startMs ?? series[0].t.getTime();
        const domainEndMs = xDomain?.endMs ?? (series[series.length - 1].t.getTime() + barIntervalMs);
        const domainSpanMs = Math.max(barIntervalMs, domainEndMs - domainStartMs);
        const toXTime = (tms) => left + (((tms - domainStartMs) / domainSpanMs) * plotW);
        const xToTime = (x) => domainStartMs + (((x - left) / Math.max(1, plotW)) * domainSpanMs);
        const toX = (idx) => {
          const row = series[idx];
          const rowMs = row ? row.t.getTime() : domainStartMs;
          return toXTime(rowMs + barIntervalMs / 2);
        };

        ctx.strokeStyle = "#214160";
        ctx.lineWidth = 1;
        ctx.font = "11px Consolas, monospace";
        ctx.fillStyle = "#8ca6c5";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        const yTicks = 3;
        for (let i = 0; i < yTicks; i += 1) {
          const frac = i / (yTicks - 1);
          const y = y0 + frac * paneHeight;
          const p = 1 - frac;
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(w - right, y);
          ctx.stroke();
          ctx.fillText(p.toFixed(1), left - 6, y);
        }

        ctx.strokeStyle = "#3b5676";
        ctx.beginPath();
        ctx.moveTo(left, y0);
        ctx.lineTo(left, y0 + paneHeight);
        ctx.lineTo(w - right, y0 + paneHeight);
        ctx.stroke();

        const metaKeys = ["p_enter_long", "p_enter_short", "p_exit_long", "p_exit_short"];
        const metaPresent = series.some((row) => metaKeys.some((key) => Number.isFinite(row[key])));
        const colors = metaPresent
          ? {
              p_enter_long: "#3b82f6",
              p_enter_short: "#f59e0b",
              p_exit_long: "#10b981",
              p_exit_short: "#ef4444"
            }
          : {
              p_pivot_long: "#3b82f6",
              p_pivot_short: "#f59e0b",
              p_tb_long: "#10b981",
              p_tb_short: "#ef4444"
            };
        const keys = metaPresent
          ? ["p_enter_long", "p_enter_short", "p_exit_long", "p_exit_short"]
          : ["p_pivot_long", "p_pivot_short", "p_tb_long", "p_tb_short"];
        keys.forEach((key) => {
          ctx.strokeStyle = colors[key];
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          let started = false;
          series.forEach((row, i) => {
            const v = row[key];
            if (!Number.isFinite(v)) return;
            const x = toX(i);
            const y = toY(Math.max(0, Math.min(1, v)));
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          });
          ctx.stroke();
        });

        ctx.fillStyle = "#9ec7ef";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = "11px Consolas, monospace";
        ctx.fillText(label, left + 6, y0 + 2);

        const xTicks = 6;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        for (let i = 0; i < xTicks; i += 1) {
          const frac = i / (xTicks - 1);
          const tickMs = domainStartMs + frac * domainSpanMs;
          const x = toXTime(tickMs);
          const labelX = Math.max(left + 28, Math.min(w - right - 28, x));
          const t = new Date(tickMs);
          ctx.beginPath();
          ctx.moveTo(x, y0 + paneHeight);
          ctx.lineTo(x, y0 + paneHeight + 4);
          ctx.strokeStyle = "#365272";
          ctx.stroke();
          ctx.fillStyle = "#8ca6c5";
          ctx.fillText(fmtTickTime(t, domainSpanMs), labelX, y0 + paneHeight + 6);
        }

        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        let legendX = left + 6;
        const legendY = y0 + 16;
        keys.forEach((key) => {
          ctx.fillStyle = colors[key];
          ctx.fillRect(legendX, legendY + 2, 10, 3);
          ctx.fillStyle = "#8ca6c5";
          ctx.fillText(key, legendX + 14, legendY - 2);
          legendX += 120;
        });
        return { series, toX, toXTime, xToTime, toY, y0, paneHeight, keys, colors, domainStartMs, domainEndMs, barIntervalMs };
      }

      const hasMetaProbSeries = probs.some((row) =>
        ["p_enter_long", "p_enter_short", "p_exit_long", "p_exit_short"].some((key) => Number.isFinite(row[key]))
      );
      const pane3 = drawProbPane(
        probs,
        pane3Y,
        pane3H,
        hasMetaProbSeries ? "Bottom: 10m meta probs" : "Bottom: 10m GA probs",
        { xDomain: pane3Domain, barIntervalMs: intervalMs }
      );

      const actionsAll = (state.action_events || [])
        .filter((a) => a && a.symbol === sym && a.timestamp)
        .slice(-600)
        .sort((a, b) => new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime());
      const modelActions = actionsAll.filter((a) => String(a.source || "model") !== "policy");
      const policyActions = actionsAll.filter((a) => String(a.source || "") === "policy");
      const actions = [];
      for (let i = 0; i < modelActions.length; i += 1) {
        const cur = modelActions[i];
        const prev = i > 0 ? modelActions[i - 1] : null;
        if (!prev || Number(cur.action) !== Number(prev.action)) actions.push(cur);
      }
      const orderMarkers = [];
      const positionSegments = [];
      const orderEvents = (state.trade_events || [])
        .filter((e) => e && e.symbol === sym && e.timestamp && e.result)
        .slice(-500)
        .sort((a, b) => new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime());
      const openSegments = { long: null, short: null };
      orderEvents.forEach((evt) => {
        const result = evt.result || {};
        const orders = Array.isArray(result.orders) ? result.orders : [];
        const evtTs = evt.timestamp;
        const evtClose = Number(result?.close);
        if (!orders.length) return;
        orders.forEach((ord, legIdx) => {
          const ordType = String(ord?.type || "order").toLowerCase();
          const verificationOrder = ord?.response?.verification?.order || {};
          const submitResp = ord?.response?.response || {};
          const orderTs =
            verificationOrder?.filled_at
            || verificationOrder?.submitted_at
            || submitResp?.filled_at
            || submitResp?.submitted_at
            || evtTs;
          const sideRaw =
            ord?.response?.side
            || ord?.response?.payload?.side
            || ord?.side
            || "";
          orderMarkers.push({
            timestamp: orderTs,
            type: ordType,
            side: String(sideRaw).toLowerCase(),
            pos: Number(result?.pos),
            legIdx: Number(legIdx)
          });
          if (!Number.isFinite(evtClose)) return;
          if (ordType === "open_long") {
            openSegments.long = { start: orderTs, end: null, price: evtClose, side: "long" };
          } else if (ordType === "close_long") {
            if (openSegments.long) {
              positionSegments.push({ ...openSegments.long, end: orderTs });
              openSegments.long = null;
            }
          } else if (ordType === "open_short") {
            openSegments.short = { start: orderTs, end: null, price: evtClose, side: "short" };
          } else if (ordType === "close_short") {
            if (openSegments.short) {
              positionSegments.push({ ...openSegments.short, end: orderTs });
              openSegments.short = null;
            }
          }
        });
      });
      if (openSegments.long) positionSegments.push({ ...openSegments.long, end: null });
      if (openSegments.short) positionSegments.push({ ...openSegments.short, end: null });

      function drawActionMarkers(pane) {
        if (!pane || !pane.series.length) return;
        const firstTs = pane.domainStartMs;
        const lastTs = pane.domainEndMs;
        actions.forEach((a) => {
          const t = new Date(a.timestamp);
          const tms = t.getTime();
          if (Number.isNaN(tms)) return;
          if (tms < firstTs || tms > lastTs) return;
          const idx = nearestIndexByTime(pane.series, tms);
          const x = pane.toX(idx);
          const actRaw = Number(a.action_raw);
          const actClass = Number.isFinite(Number(a.action_class))
            ? Number(a.action_class)
            : (Number.isFinite(actRaw) ? (actRaw > 0 ? 1 : (actRaw < 0 ? -1 : 0)) : Number(a.action));
          const color = actClass === 1 ? "#2ccf7a" : (actClass === -1 ? "#f05c52" : "#b7c3d1");

          ctx.save();
          ctx.setLineDash([4, 3]);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, pane.y0 + 14);
          ctx.lineTo(x, pane.y0 + pane.paneHeight);
          ctx.stroke();
          ctx.restore();

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x, pane.y0 + 4);
          ctx.lineTo(x - 4, pane.y0 + 12);
          ctx.lineTo(x + 4, pane.y0 + 12);
          ctx.closePath();
          ctx.fill();
        });
      }

      function classifyPolicyMarker(a) {
        const longCt = Number(a.long_contracts);
        const shortCt = Number(a.short_contracts);
        const tgtLong = Number(a.target_long_contracts);
        const tgtShort = Number(a.target_short_contracts);
        const ev = String(a.policy_event || "").toLowerCase();
        if (longCt > 0 && shortCt > 0) return { kind: "hedged", color: "#f0b04f", fill: "#f0b04f" };
        if (tgtLong > longCt && tgtShort <= shortCt) return { kind: "long_intent", color: "#69e3aa", fill: null };
        if (tgtShort > shortCt && tgtLong <= longCt) return { kind: "short_intent", color: "#ff8f8f", fill: null };
        if (tgtLong < longCt && tgtShort <= shortCt) return { kind: "long_exit_intent", color: "#d8dde6", fill: null };
        if (tgtShort < shortCt && tgtLong <= longCt) return { kind: "short_exit_intent", color: "#d8dde6", fill: null };
        if (ev === "multi_update" && longCt > 0 && shortCt > 0) return { kind: "hedged", color: "#f0b04f", fill: "#f0b04f" };
        if (longCt > 0 && shortCt <= 0) return { kind: "long", color: "#2ccf7a", fill: "#2ccf7a" };
        if (shortCt > 0 && longCt <= 0) return { kind: "short", color: "#f05c52", fill: "#f05c52" };
        return { kind: "flat", color: "#b7c3d1", fill: "#b7c3d1" };
      }

      function drawPolicyMarkers(pane) {
        if (!pane || !pane.series.length || !policyActions.length) return;
        const firstTs = pane.domainStartMs;
        const lastTs = pane.domainEndMs;
        policyActions.forEach((a) => {
          const t = new Date(a.timestamp);
          const tms = t.getTime();
          if (Number.isNaN(tms) || tms < firstTs || tms > lastTs) return;
          const idx = nearestIndexByTime(pane.series, tms);
          const x = pane.toX(idx);
          const spec = classifyPolicyMarker(a);
          const y = pane.y0 + 6;
          ctx.save();
          ctx.strokeStyle = spec.color;
          ctx.fillStyle = spec.fill || "transparent";
          ctx.lineWidth = 1.5;
          if (spec.kind === "long" || spec.kind === "long_intent") {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 6, y + 10);
            ctx.lineTo(x + 6, y + 10);
            ctx.closePath();
            spec.fill ? ctx.fill() : ctx.stroke();
          } else if (spec.kind === "short" || spec.kind === "short_intent") {
            ctx.beginPath();
            ctx.moveTo(x, y + 10);
            ctx.lineTo(x - 6, y);
            ctx.lineTo(x + 6, y);
            ctx.closePath();
            spec.fill ? ctx.fill() : ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 6, y + 5);
            ctx.lineTo(x, y + 10);
            ctx.lineTo(x + 6, y + 5);
            ctx.closePath();
            spec.fill ? ctx.fill() : ctx.stroke();
          }
          ctx.restore();
        });
      }

      function drawOrderMarkers(pane) {
        if (!pane || !pane.series.length || !orderMarkers.length) return;
        const firstTs = pane.domainStartMs;
        const lastTs = pane.domainEndMs;
        orderMarkers.forEach((m) => {
          const t = new Date(m.timestamp);
          const tms = t.getTime();
          if (Number.isNaN(tms) || tms < firstTs || tms > lastTs) return;
          const idx = nearestIndexByTime(pane.series, tms);
          const x = pane.toX(idx);
          const isOpen = m.type === "open" || m.type.startsWith("open_");
          const isClose = m.type === "close" || m.type.startsWith("close_");
          const isBuy = m.side === "buy";
          const isSell = m.side === "sell";
          let color = "#b7c3d1";
          if (isOpen) {
            color = Number.isFinite(m.pos) ? (m.pos >= 0 ? "#40d69a" : "#ff6f6f") : (isBuy ? "#40d69a" : "#ff6f6f");
          } else if (isClose) {
            color = "#f0b04f";
          }
          const yBase = pane.y0 + 18 + Math.min(4, Math.max(0, Number(m.legIdx) || 0)) * 11;

          ctx.save();
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = 1;
          if (isClose || isSell) {
            ctx.beginPath();
            ctx.moveTo(x - 4, yBase - 4);
            ctx.lineTo(x + 4, yBase - 4);
            ctx.lineTo(x + 4, yBase + 4);
            ctx.lineTo(x - 4, yBase + 4);
            ctx.closePath();
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(x, yBase, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });
      }

      function drawPositionSegments(pane) {
        if (!pane || !pane.series.length || !positionSegments.length) return;
        const firstTs = pane.domainStartMs;
        const lastTs = pane.domainEndMs;
        positionSegments.forEach((seg) => {
          if (!Number.isFinite(seg.price)) return;
          const startDate = new Date(seg.start);
          const endDate = seg.end ? new Date(seg.end) : new Date(lastTs);
          const startMs = startDate.getTime();
          const endMs = endDate.getTime();
          if (Number.isNaN(startMs) || Number.isNaN(endMs)) return;
          if (endMs < firstTs || startMs > lastTs) return;
          const startIdx = nearestIndexByTime(pane.series, Math.max(startMs, firstTs));
          const endIdx = nearestIndexByTime(pane.series, Math.min(endMs, lastTs));
          const x1 = pane.toX(Math.min(startIdx, endIdx));
          const x2 = pane.toX(Math.max(startIdx, endIdx));
          const y = pane.toY(seg.price);
          const color = seg.side === "long" ? "#40d69a" : "#ff7a7a";

          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);
          ctx.stroke();

          // End caps make it easier to see the exact held region.
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x1, y - 5);
          ctx.lineTo(x1, y + 5);
          ctx.moveTo(x2, y - 5);
          ctx.lineTo(x2, y + 5);
          ctx.stroke();
          ctx.restore();
        });
      }

      drawPositionSegments(pane1);
      drawPositionSegments(pane2);
      drawActionMarkers(pane1);
      drawActionMarkers(pane2);
      drawPolicyMarkers(pane1);
      drawPolicyMarkers(pane2);
      drawOrderMarkers(pane1);
      drawOrderMarkers(pane2);

      function drawHoverCrosshair(pane) {
        if (!hover.active || !pane || !pane.series?.length || typeof pane.fromY !== "function") return;
        const paneTop = pane.y0;
        const paneBottom = pane.y0 + pane.paneHeight;
        if (hover.y < paneTop || hover.y > paneBottom) return;

        const xMin = left;
        const xMax = w - right;
        const xClamped = Math.max(xMin, Math.min(xMax, hover.x));
        const yClamped = Math.max(paneTop, Math.min(paneBottom, hover.y));
        const idx = nearestIndexByTime(pane.series, pane.xToTime(xClamped));
        const xBar = pane.toX(idx);
        const candle = pane.series[idx];
        if (!candle) return;

        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#9ec7ef";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(xBar, paneTop);
        ctx.lineTo(xBar, paneBottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(left, yClamped);
        ctx.lineTo(w - right, yClamped);
        ctx.stroke();
        ctx.restore();

        const priceVal = pane.fromY(yClamped);
        const priceText = fmtPrice(priceVal);
        const timeText = fmtHoverTime(candle.t);
        const padX = 6;
        const padY = 4;
        const labelH = 18;

        ctx.font = "12px Consolas, monospace";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        const priceW = Math.ceil(ctx.measureText(priceText).width) + padX * 2;
        const priceX = w - right - priceW - 2;
        const priceY = Math.max(paneTop + 2, Math.min(paneBottom - labelH - 2, yClamped - labelH / 2));
        ctx.fillStyle = "#123a52";
        ctx.fillRect(priceX, priceY, priceW, labelH);
        ctx.strokeStyle = "#6bd1ff";
        ctx.lineWidth = 1;
        ctx.strokeRect(priceX, priceY, priceW, labelH);
        ctx.fillStyle = "#d9f2ff";
        ctx.fillText(priceText, priceX + padX, priceY + labelH / 2);

        const timeW = Math.ceil(ctx.measureText(timeText).width) + padX * 2;
        const timeX = Math.max(left, Math.min(w - right - timeW, xBar - timeW / 2));
        const timeY = Math.min(h - labelH - 1, paneBottom + 6);
        ctx.fillStyle = "#0f2c44";
        ctx.fillRect(timeX, timeY, timeW, labelH);
        ctx.strokeStyle = "#4eaee0";
        ctx.strokeRect(timeX, timeY, timeW, labelH);
        ctx.fillStyle = "#cde7fb";
        ctx.fillText(timeText, timeX + padX, timeY + labelH / 2);
      }

      function drawProbHoverCrosshair(pane) {
        if (!hover.active || !pane || !pane.series?.length) return;
        const paneTop = pane.y0;
        const paneBottom = pane.y0 + pane.paneHeight;
        if (hover.y < paneTop || hover.y > paneBottom) return;

        const xMin = left;
        const xMax = w - right;
        const xClamped = Math.max(xMin, Math.min(xMax, hover.x));
        const yClamped = Math.max(paneTop, Math.min(paneBottom, hover.y));
        const idx = nearestIndexByTime(pane.series, pane.xToTime(xClamped));
        const xBar = pane.toX(idx);
        const row = pane.series[idx];
        if (!row) return;

        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "#9ec7ef";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(xBar, paneTop);
        ctx.lineTo(xBar, paneBottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(left, yClamped);
        ctx.lineTo(w - right, yClamped);
        ctx.stroke();
        ctx.restore();

        const probVal = Math.max(0, Math.min(1, 1 - ((yClamped - paneTop) / Math.max(1, pane.paneHeight))));
        const probText = probVal.toFixed(3);
        const timeText = fmtHoverTime(row.t);
        const padX = 6;
        const labelH = 18;

        ctx.font = "12px Consolas, monospace";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        const probW = Math.ceil(ctx.measureText(probText).width) + padX * 2;
        const probX = w - right - probW - 2;
        const probY = Math.max(paneTop + 2, Math.min(paneBottom - labelH - 2, yClamped - labelH / 2));
        ctx.fillStyle = "#123a52";
        ctx.fillRect(probX, probY, probW, labelH);
        ctx.strokeStyle = "#6bd1ff";
        ctx.lineWidth = 1;
        ctx.strokeRect(probX, probY, probW, labelH);
        ctx.fillStyle = "#d9f2ff";
        ctx.fillText(probText, probX + padX, probY + labelH / 2);

        const timeW = Math.ceil(ctx.measureText(timeText).width) + padX * 2;
        const timeX = Math.max(left, Math.min(w - right - timeW, xBar - timeW / 2));
        const timeY = Math.min(h - labelH - 1, paneBottom + 6);
        ctx.fillStyle = "#0f2c44";
        ctx.fillRect(timeX, timeY, timeW, labelH);
        ctx.strokeStyle = "#4eaee0";
        ctx.strokeRect(timeX, timeY, timeW, labelH);
        ctx.fillStyle = "#cde7fb";
        ctx.fillText(timeText, timeX + padX, timeY + labelH / 2);

        const lines = (pane.keys || []).map((key) => {
          const v = row[key];
          return `${key}: ${Number.isFinite(v) ? Number(v).toFixed(3) : "NA"}`;
        });
        ctx.textBaseline = "top";
        ctx.font = "11px Consolas, monospace";
        const lineHeight = 14;
        const boxW = Math.max(
          120,
          ...lines.map((line) => Math.ceil(ctx.measureText(line).width) + 12)
        );
        const boxH = lines.length * lineHeight + 8;
        const boxX = Math.max(left + 4, Math.min(w - right - boxW - 4, xBar + 10));
        const boxY = Math.max(paneTop + 4, Math.min(paneBottom - boxH - 4, paneTop + 6));
        ctx.fillStyle = "rgba(10, 23, 37, 0.92)";
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = "#365272";
        ctx.strokeRect(boxX, boxY, boxW, boxH);
        lines.forEach((line, i) => {
          const key = (pane.keys || [])[i];
          ctx.fillStyle = pane.colors?.[key] || "#d7e4f7";
          ctx.fillText(line, boxX + 6, boxY + 4 + i * lineHeight);
        });
      }

      drawHoverCrosshair(pane1);
      drawHoverCrosshair(pane2);
      drawProbHoverCrosshair(pane3);

      // Shared marker legend.
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = "11px Consolas, monospace";
      ctx.fillStyle = "#b7c3d1";
      ctx.fillText("Markers: dashed arrows=model signals, outlined markers=policy intents/exits, solid markers=actual side state, circles/squares=orders, hold lines=until close.", left + 6, 6);

      const olderBars = Math.max(0, Number(view.offset_10m_bars || 0));
      const viewText = olderBars > 0
        ? `view: ${olderBars} x 10m bars back | wheel down=older, up=newer`
        : `view: latest | wheel down=older, up=newer`;
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.font = "11px Consolas, monospace";
      ctx.fillStyle = olderBars > 0 ? "#f0d27d" : "#8ca6c5";
      ctx.fillText(viewText, w - right - 4, 6);
    }

    function renderAll() {
      const running = !!(state.running || state.session_alive);
      syncSymbolSelect();
      renderMeta();
      renderBroker();
      renderTrades();
      renderLogs();
      renderChart();
      startBtn.disabled = running;
      stopBtn.disabled = !running;
      if (state.last_error) updateStatus(`error: ${state.last_error}`, "error");
      else updateStatus(state.status_message || (running ? "running" : "idle"), running ? "running" : "idle");
    }

    function applySnapshot(snap) {
      Object.assign(state, snap || {});
      if (snap && typeof snap.ui_build === "undefined") {
        state.last_error = "outdated dashboard server detected; restart python -m UI.live_dashboard";
        state.status_message = "server restart required";
      }
      renderAll();
    }

    function attachEvents() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource("/api/events");
      eventSource.onmessage = (msg) => {
        const evt = JSON.parse(msg.data);
        const p = evt.payload || {};
        if (evt.type === "hello") { applySnapshot(p); return; }
        if (evt.type === "state_sync" && p.state) { applySnapshot(p.state); return; }
        if (evt.type === "status") {
          if (typeof p.running === "boolean") state.running = p.running;
          if (p.message) state.status_message = p.message;
          if (p.running) state.last_error = null;
          if (p.error) state.last_error = p.error;
          if (p.message) state.logs = [...(state.logs || []), { symbol: "SYSTEM", message: p.message }].slice(-400);
        } else if (evt.type === "bar_1m") {
          state.symbols = state.symbols?.length ? state.symbols : [p.symbol];
          pushLimited(state.bars_1m, p.symbol, p.bar, MAX_POINTS_1M);
        } else if (evt.type === "bar_15m") {
          pushLimited(state.bars_15m, p.symbol, p.bar, MAX_POINTS_SIGNAL);
        } else if (evt.type === "action") {
          state.last_actions = state.last_actions || {};
          state.last_actions[p.symbol] = {
            action: p.action,
            action_class: p.action_class,
            action_raw: p.action_raw,
            timestamp: p.timestamp,
            close: p.close
          };
          state.action_events = state.action_events || [];
          state.action_events.push({
            symbol: p.symbol,
            action: p.action,
            action_class: p.action_class,
            action_raw: p.action_raw,
            timestamp: p.timestamp,
            close: p.close
          });
          if (state.action_events.length > 5000) state.action_events = state.action_events.slice(-5000);
          if (p.agent_state) state.agent_state = normalizeAgentState(p.agent_state);
        } else if (evt.type === "order_policy") {
          state.policy_state = state.policy_state || {};
          state.policy_state[p.symbol] = p.policy_state;
          if (p.broker_state) {
            state.broker_state = state.broker_state || {};
            state.broker_state[p.symbol] = p.broker_state;
          }
          const ev = p?.result?.event || "";
          if (ev && ev !== "hold" && ev !== "no_change") {
            state.action_events = state.action_events || [];
            state.action_events.push({
              symbol: p.symbol,
              source: "policy",
              timestamp: p.timestamp,
              policy_event: ev,
              position: p?.policy_state?.position,
              long_contracts: p?.policy_state?.long_contracts,
              short_contracts: p?.policy_state?.short_contracts,
              target_long_contracts: p?.result?.target_long_contracts,
              target_short_contracts: p?.result?.target_short_contracts,
              long_decision_reason: p?.policy_state?.long_decision_reason,
              short_decision_reason: p?.policy_state?.short_decision_reason
            });
            if (state.action_events.length > 5000) state.action_events = state.action_events.slice(-5000);
          }
          if (ev && ev !== "hold" && ev !== "no_change") {
            state.trade_events = [...(state.trade_events || []), p].slice(-400);
          }
        } else if (evt.type === "trade_event") {
          const ev = p?.result?.event || "";
          if (ev) state.trade_events = [...(state.trade_events || []), p].slice(-400);
        } else if (evt.type === "broker_state") {
          state.broker_state = state.broker_state || {};
          state.broker_state[p.symbol] = p.state;
        } else if (evt.type === "log") {
          state.logs = [...(state.logs || []), p].slice(-400);
        } else if (evt.type === "agent_state" && p.state) {
          state.agent_state = normalizeAgentState(p.state);
        } else if (evt.type === "startup_sync") {
          state.logs = [...(state.logs || []), { symbol: p.symbol || "SYSTEM", message: `startup_sync ${JSON.stringify(p.result || {})}` }].slice(-400);
        }
        renderAll();
      };
    }

    function currentPayload() {
      const replayMaxRaw = document.getElementById("replayMaxBars").value;
      return {
        runner_mode: document.getElementById("runnerMode").value,
        inference_mode: "meta",
        symbols: document.getElementById("symbols").value,
        feed: document.getElementById("feed").value,
        interval: Number(document.getElementById("interval").value),
        model_path: null,
        meta_model_root: document.getElementById("metaModelRoot").value,
        meta_base_frame_path: document.getElementById("metaBaseFramePath").value,
        prefill_path: document.getElementById("prefillPath").value,
        prefill_start: document.getElementById("prefillStart").value,
        no_prefill_fetch: document.getElementById("noPrefillFetch").checked,
        replay_data_path: document.getElementById("replayDataPath").value,
        replay_start: document.getElementById("replayStart").value || null,
        replay_end: document.getElementById("replayEnd").value || null,
        replay_sleep: Number(document.getElementById("replaySleep").value || 0),
        replay_max_bars: replayMaxRaw ? Number(replayMaxRaw) : null,
        replay_regular_only: document.getElementById("replayRegularOnly").checked,
        replay_no_prepend_split_test_warmup: document.getElementById("replayNoWarmup").checked,
        exec_flip_abs_threshold: Number(document.getElementById("execFlipAbsThreshold").value || 0),
        env_file: document.getElementById("envFile").value,
        enable_option_orders: document.getElementById("enableOrders").checked,
        simulate_orders: document.getElementById("simulateOrders").checked,
        no_agent: false,
        eval_parity_mode: false,
        startup_catchup_order: document.getElementById("startupCatchupOrder").checked,
        startup_catchup_max_age_min: Number(document.getElementById("startupCatchupMaxAgeMin").value || 120)
      };
    }

    document.getElementById("startBtn").addEventListener("click", async () => {
      const out = await api("/api/start", "POST", currentPayload());
      if (!out.ok) {
        state.last_error = `start failed (${out.status}): ${out.error || "unknown"}`;
        state.status_message = "start failed";
        renderAll();
        return;
      }
      applySnapshot(out.state || out.data?.state || out.data);
    });
    document.getElementById("stopBtn").addEventListener("click", async () => {
      const out = await api("/api/stop", "POST", {});
      if (!out.ok) {
        state.last_error = `stop failed (${out.status}): ${out.error || "unknown"}`;
        state.status_message = "stop failed";
        renderAll();
        return;
      }
      applySnapshot(out.state || out.data?.state || out.data);
    });
    document.getElementById("refreshBtn").addEventListener("click", async () => {
      const out = await api("/api/state");
      if (!out.ok) {
        state.last_error = `refresh failed (${out.status}): ${out.error || "unknown"}`;
        state.status_message = "refresh failed";
        renderAll();
        return;
      }
      applySnapshot(out.data);
    });
    symbolSelect.addEventListener("change", renderAll);
    document.getElementById("runnerMode").addEventListener("change", applyModeUi);
    chart.addEventListener("mousemove", (ev) => {
      const rect = chart.getBoundingClientRect();
      hover.active = true;
      hover.x = ev.clientX - rect.left;
      hover.y = ev.clientY - rect.top;
      renderChart();
    });
    chart.addEventListener("mouseleave", () => {
      hover.active = false;
      renderChart();
    });
    chart.addEventListener("wheel", (ev) => {
      const sym = symbolSelect.value || state.symbols?.[0];
      if (!sym) return;
      const { view, maxOffset } = clampChartOffset(sym);
      if (maxOffset <= 0) return;
      ev.preventDefault();
      const steps = Math.max(1, Math.round(Math.abs(ev.deltaY) / 80));
      const deltaBars = steps * CHART_WHEEL_STEP_BARS;
      if (ev.deltaY > 0) view.offset_10m_bars = Math.min(maxOffset, view.offset_10m_bars + deltaBars);
      else view.offset_10m_bars = Math.max(0, view.offset_10m_bars - deltaBars);
      renderChart();
    }, { passive: false });
    window.addEventListener("resize", renderChart);

    (async function init() {
      const out = await api("/api/state");
      if (out.ok) applySnapshot(out.data);
      else {
        state.last_error = `init failed (${out.status}): ${out.error || "unknown"}`;
        state.status_message = "init failed";
        renderAll();
      }
      applyModeUi();
      attachEvents();
    })();
  </script>
</body>
</html>
